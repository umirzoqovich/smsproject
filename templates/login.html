<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — SMS Campaign & CRM</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#060911', 900: '#090d16', 800: '#111827', 700: '#1f2937', 600: '#374151' },
                        emerald: { 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

    <style>
        body {
            background: #090d16;
            color: #e5e7eb;
            font-family: 'Inter', system-ui, sans-serif;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(5, 150, 105, 0.06) 0%, transparent 40%);
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(31, 41, 55, 0.9);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(16, 185, 129, 0.05);
        }
        .glow-border:focus-within {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/10">
                <i data-lucide="message-square" class="w-8 h-8 text-emerald-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">SMS Campaign & CRM</h1>
            <p class="text-sm text-gray-400 mt-1">Shaxsiy kabinetingizga kiring</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-2xl p-8">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- Error Alert -->
                <div id="errorAlert" class="hidden p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-medium flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                    <span id="errorMessage">Login yoki parol noto'g'ri</span>
                </div>

                <!-- Username -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Foydalanuvchi nomi (Login)</label>
                    <div class="relative flex items-center glow-border rounded-xl border border-dark-600 bg-dark-900 transition-all">
                        <span class="pl-3.5 text-gray-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="username" required autofocus placeholder="admin"
                            class="w-full bg-transparent px-3 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Parol</label>
                    <div class="relative flex items-center glow-border rounded-xl border border-dark-600 bg-dark-900 transition-all">
                        <span class="pl-3.5 text-gray-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full bg-transparent px-3 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none">
                        <button type="button" onclick="togglePasswordVisibility()" class="pr-3.5 text-gray-500 hover:text-gray-300">
                            <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-semibold text-sm transition-all duration-300 shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/30 flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Tizimga kirish</span>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-dark-700/60 text-center">
                <p class="text-xs text-gray-500">
                    Akkaunt kerakmi? Administrator bilan bog'laning.
                </p>
            </div>
        </div>

        <p class="text-center text-xs text-gray-600 mt-6">
            SMS Bridge Pro & CRM Dashboard v2.5
        </p>
    </div>

    <script>
        lucide.createIcons();

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.setAttribute('data-lucide', 'eye-off');
            } else {
                pwd.type = 'password';
                eye.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errBox = document.getElementById('errorAlert');
            const errMsg = document.getElementById('errorMessage');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> Tekshirilmoqda...`;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();

                if (resp.ok && data.ok) {
                    btn.innerHTML = `✅ Muvaffaqiyatli! Yuklanmoqda...`;
                    window.location.href = data.redirect || '/';
                } else {
                    errMsg.textContent = data.detail || data.message || "Login yoki parol noto'g'ri";
                    errBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Tizimga kirish</span>`;
                    lucide.createIcons();
                }
            } catch (err) {
                errMsg.textContent = "Server bilan aloqa uzildi. Qayta urinib ko'ring.";
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Tizimga kirish</span>`;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
